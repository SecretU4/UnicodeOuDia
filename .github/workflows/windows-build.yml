name: Windows build

on:
  push:
    branches:
      - feature/full-unicode-utf8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-debug-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate Visual Studio C++ tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ x86/x64 tools were not found." }
          Write-Host "Visual Studio: $vs"
          $msvc = Join-Path $vs "VC\Tools\MSVC"
          Get-ChildItem $msvc | Select-Object -ExpandProperty Name

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OuDia (Win32)
        shell: pwsh
        run: |
          msbuild DiagramEdit\DiagramEdit\DiagramEdit.vcxproj /m /v:minimal /t:Build /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /p:RestorePackages=false

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OuDia-Debug-Win32
          path: DiagramEdit\Debug\DiagramEdit.exe
          if-no-files-found: error
