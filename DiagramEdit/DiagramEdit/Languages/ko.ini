Text.ファイルの形式の変換に失敗しました。=파일 형식 변환에 실패했습니다.
Text.ファイル %s は内容が壊れています。(%d)=파일 %s의 내용이 손상되었습니다. (%d)
Text.列車種別の数が多すぎます。\nWinDIA 形式のファイルでは、列車種別は 24 種類以下に制限されています。=열차 종류가 너무 많습니다.\nWinDIA 형식에서는 열차 종류를 최대 24개까지 지원합니다.
Text.ダイヤがひとつもありません。\nWinDIA 形式のファイルに保存するためには、ダイヤが１つ作成されていなくてはなりません。=다이어가 없습니다.\nWinDIA 형식으로 저장하려면 다이어가 하나 이상 있어야 합니다.
Text.略称の長さが全角２文字を超える列車種別があります。\nWinDIA 形式に保存するためには、すべての列車種別略称は全角２文字以内でなくてはなりません。=약칭이 전각 2자를 초과하는 열차 종류가 있습니다.\nWinDIA 형식으로 저장하려면 모든 약칭이 전각 2자 이하여야 합니다.
Text.列車種別 %s の列車が存在します(%s %s)。\n列車種別の削除はできません。\n=열차 종류 %s에 해당하는 열차가 존재합니다(%s %s).\n열차 종류를 삭제할 수 없습니다.\n
Text.時刻のみ貼り付け を行うためには、\nクリップボードの列車は１本でなくてはなりません。=시각만 붙여넣으려면\n클립보드에 열차가 하나만 있어야 합니다.
Text.操作対象の着時刻が指定されていないため、\n着時刻の変更はできません。=대상 도착 시각이 지정되지 않아\n도착 시각을 변경할 수 없습니다.
Text.操作対象の発時刻が指定されていないため、\n着時刻の変更はできません。=대상 발차 시각이 지정되지 않아\n도착 시각을 변경할 수 없습니다.
Text.操作対象の発時刻が指定されていないため、\n発時刻の変更はできません。=대상 발차 시각이 지정되지 않아\n발차 시각을 변경할 수 없습니다.
Text.操作対象の着時刻が指定されていないため、\n発時刻の変更はできません。=대상 도착 시각이 지정되지 않아\n발차 시각을 변경할 수 없습니다.
Text.駅間最小所要秒数列車が決定できません。\n時刻が%s駅と%s駅の両方に設定された列車が１本もありません。=역간 최소 소요 시간을 계산할 수 없습니다.\n%s역과 %s역 양쪽에 시각이 설정된 열차가 없습니다.
Text.ダイヤ名 %s は、すでに存在します。\nダイヤ名は、重複してはいけません。\n他の名前を指定してください。=다이어 이름 %s은(는) 이미 존재합니다.\n다이어 이름은 중복될 수 없습니다.\n다른 이름을 지정하십시오.
