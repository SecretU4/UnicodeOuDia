Text.列車種別の数が多すぎます。\nWinDIA 形式のファイルでは、列車種別は 24 種類以下に制限されています。=There are too many train types.\nWinDIA files support up to 24 train types.
Text.ダイヤがひとつもありません。\nWinDIA 形式のファイルに保存するためには、ダイヤが１つ作成されていなくてはなりません。=There are no diagrams.\nAt least one diagram is required to save in WinDIA format.
Text.略称の長さが全角２文字を超える列車種別があります。\nWinDIA 形式に保存するためには、すべての列車種別略称は全角２文字以内でなくてはなりません。=Some train type abbreviations exceed two full-width characters.\nWinDIA format requires all abbreviations to be no longer than two full-width characters.
